name: Bug
description: Something does not work as expected.
labels: [type/fix, workflow/backlog]
body:
  - type: textarea
    id: description
    attributes:
      label: Summary
      description: The outcome in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps, expected result, actual result. URL and browser if relevant.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed now. Link the Wiki requirement or related issues.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What the change must do. One verifiable statement per line.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        In:
        - 
        Out:
        -
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues or external work this depends on. "None" if independent.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How completion is proven (checks, tests, URLs, evidence).
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [critical, high, medium, low]
      default: 2
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Changed lines in the PR, lockfiles excluded. XL must be split.
      options: ['XS (≤50)', 'S (≤150)', 'M (≤300)', 'L (≤550)', 'XL (>550, split)']
      default: 1
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [feature, fix, refactor, chore, ci, test, security, design, content, docs]
      default: 1
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [dev, preview, production]
      default: 0
    validations:
      required: true
